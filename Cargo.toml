[package]
name = "rocom-pets"
version = "0.0.0"
edition = "2024"
publish = false
description = "桌面宠物运行时(Phase 0 spike:平台层验证)"

[dependencies]
anyhow = "1.0.104"
bytemuck = "1.25.2"
# 配置窗口(`--settings`)。**走 glow 而不是 wgpu 后端**:配置窗口只是些控件,
# 犯不着把第二份 wgpu(与桌宠那份版本还不同)链进同一个二进制。
eframe = { version = "0.35.0", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
env_logger = "0.11.11"
glam = "0.33.2"
gltf = "1.4.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
log = "0.4.33"
pollster = "1.0.1"
raw-window-handle = "0.6.2"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "vorbis"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.3"
toml_edit = "0.25.13"
wgpu = "30.0.0"
zbus = { version = "5.18.0", default-features = false, features = ["blocking-api", "async-io"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(target_os = "linux")'.dependencies]
# 选文件的原生对话框(配置窗口的「导入」)。**走 XDG portal 而不是 GTK**:
# 只为一个文件对话框把整套 GTK3 链进来不值当,而 portal 走的是我们已经有的 zbus。
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
signal-hook = "0.4.4"
smithay-client-toolkit = { version = "0.21.1", features = ["system"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Windows 上是系统自带的 COM 对话框,不需要额外依赖
rfd = { version = "0.17.2", default-features = false, features = [
    "common-controls-v6",
] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
