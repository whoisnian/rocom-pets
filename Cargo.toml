[package]
name = "rocom-pets"
version = "0.0.0"
edition = "2024"
publish = false
description = "桌面宠物运行时(Phase 0 spike:平台层验证)"

[dependencies]
anyhow = "1.0.104"
bytemuck = "1.25.2"
env_logger = "0.11.11"
glam = "0.33.2"
gltf = "1.4.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
log = "0.4.33"
pollster = "1.0.1"
raw-window-handle = "0.6.2"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "vorbis"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.3"
wgpu = "30.0.0"
zbus = { version = "5.18.0", default-features = false, features = ["blocking-api", "async-io"] }

[target.'cfg(target_os = "linux")'.dependencies]
signal-hook = "0.4.4"
smithay-client-toolkit = { version = "0.21.1", features = ["system"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = "0.62.2"
