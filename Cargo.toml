[package]
name = "rocom-pets"
version = "0.0.0"
edition = "2024"
publish = false
description = "桌面宠物运行时:KDE Wayland 与 Windows 10+ 双后端"

# 分发用的档:桌宠是「拷过去双击就跑」的东西,二进制大小值得花这点编译时间。
# 实测(Linux x86_64):31.7MB → 18.0MB,代价是编译从 1m09s 涨到 2m46s。
# `strip` 去符号后崩溃回溯只剩地址 —— 要排查就用 `cargo build`(debug 档不受影响)。
[profile.release]
lto = "fat"        # 跨 crate 内联 + 死代码消除,占了减重的大头
codegen-units = 1  # 不切分,换更充分的优化(编译只能单线程,慢在这儿)
panic = "abort"    # 桌宠没有捕获 panic 再续跑的地方,展开表纯属白带
strip = "symbols"

# **依赖按优化档编,自己的代码仍是 debug。**
#
# 日常是 `cargo run` 跑的,而这个程序的重活几乎全在依赖里:读 glb(gltf + 贴图解码)、
# 解 ogg(symphonia)。不开这条时它们按 opt-level=0 编,切一次形态实测要 0.9~1.5 秒
# (同一台机器 release 只要 44~68ms);开了之后降到 0.3~0.5 秒。
# 还嫌慢就再加 `[profile.dev] opt-level = 1`(自己的代码也优化,调试体验会打点折),
# 或者直接跑 --release。
# 自己的代码不受影响,断点、变量名、行号照旧。代价是依赖第一次编译慢一些,之后有缓存。
[profile.dev.package."*"]
opt-level = 2

[lib]
name = "rocom_pets"
# `cdylib` 是下载站预览那份 wasm 要的;`rlib` 给同包的 bin 与单测用。
crate-type = ["rlib", "cdylib"]

# ── 两个目标都要的:渲染、动画、包格式、行为 ────────────────────────────
[dependencies]
anyhow = "1.0.104"
bytemuck = "1.25.2"
glam = "0.33.2"
gltf = "1.4.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = "0.4.33"
# 叫声解码。**两个目标都要**:`stage` 的 `SoundCue`/`VoiceBank` 用它的 `Pcm`,
# 而 wasm 上 rodio 本身编得过(cpal 有 web-audio 后端),为它拆一套 cfg 不划算。
rodio = { version = "0.22.2", default-features = false, features = ["playback", "vorbis"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.3"
wgpu = "30.0.0"

# ── 只有桌面版要的 ──────────────────────────────────────────────────
#
# **这一组以前是无条件的**,于是 Linux 托盘那套(ksni → zbus → async-io → rustix)
# 连 Windows 版都跟着编;而 wasm 上 `errno` 直接 `compile_error!`,库根本构建不了。
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# 配置窗口(`--settings`)。**走 glow 而不是 wgpu 后端**:配置窗口只是些控件,
# 犯不着把第二份 wgpu(与桌宠那份版本还不同)链进同一个二进制。
eframe = { version = "0.35.0", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
env_logger = "0.11.11"
pollster = "1.0.1"
raw-window-handle = "0.6.2"
toml_edit = "0.25.13"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }

# ── 只有网页预览要的 ────────────────────────────────────────────────
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3.83"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.56"
web-sys = { version = "0.3.83", features = ["HtmlCanvasElement"] }

[target.'cfg(target_os = "linux")'.dependencies]
# 托盘。**这两个以前是无条件依赖**,于是 Windows 版也跟着编了一份 DBus 栈。
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
zbus = { version = "5.18.0", default-features = false, features = ["blocking-api", "async-io"] }
# 选文件的原生对话框(配置窗口的「导入」)。**走 XDG portal 而不是 GTK**:
# 只为一个文件对话框把整套 GTK3 链进来不值当,而 portal 走的是我们已经有的 zbus。
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
signal-hook = "0.4.4"
smithay-client-toolkit = { version = "0.21.1", features = ["system"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Windows 上是系统自带的 COM 对话框,不需要额外依赖
rfd = { version = "0.17.2", default-features = false, features = [
    "common-controls-v6",
] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
egui_kittest = "0.35.0"
